name: Test no results - issue metrics with empty search
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run issue-metrics action with query that returns no results
        id: action
        uses: .
        env:
          GH_TOKEN: ${{ github.token }}
          SEARCH_QUERY: "repo:github-community-projects/issue-metrics is:issue created:2000-01-01..2000-01-02"
          REPORT_TITLE: "Empty Metrics Report"
          OUTPUT_FILE: "issue_metrics.md"

      - name: Assert output file was created even with no results
        run: |
          echo "Checking for issue_metrics.md..."
          if [ ! -f "issue_metrics.md" ]; then
            echo "FAIL: issue_metrics.md was not created"
            exit 1
          fi
          echo "PASS: issue_metrics.md exists"

      - name: Assert output file contains report title
        run: |
          echo "Checking report title in output..."
          if ! grep -q "Empty Metrics Report" issue_metrics.md; then
            echo "FAIL: Report title not found in output"
            cat issue_metrics.md
            exit 1
          fi
          echo "PASS: Report title found in output"

      - name: Show output file contents
        run: |
          echo "=== issue_metrics.md contents ==="
          cat issue_metrics.md
