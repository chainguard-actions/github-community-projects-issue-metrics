name: Test missing token fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          SEARCH_QUERY: "repo:github-community-projects/issue-metrics is:issue is:closed"
          # GH_TOKEN intentionally omitted to test failure behavior
      - name: Assert action failed without token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when GH_TOKEN is not set, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when GH_TOKEN was not provided"
