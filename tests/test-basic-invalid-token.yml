name: Test basic usage with invalid token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with SEARCH_QUERY and invalid GH_TOKEN (expect failure at API call)
        id: action
        uses: .
        env:
          GH_TOKEN: ghp_fakeinvalidtoken1234567890abcdefghij
          SEARCH_QUERY: "repo:actions/checkout is:issue created:2020-01-01..2020-01-02"
          REPORT_TITLE: "Test Issue Metrics Report"
          HIDE_TIME_TO_CLOSE: "true"
          HIDE_TIME_TO_FIRST_RESPONSE: "true"
        continue-on-error: true

      - name: Assert action failed (expected - invalid token causes API auth failure)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with an invalid GitHub token"
            exit 1
          fi
          echo "PASS: action correctly failed when using an invalid GitHub token"
