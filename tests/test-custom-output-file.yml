name: Test custom output file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run issue-metrics action with custom output file
        id: action
        uses: .
        env:
          GH_TOKEN: ${{ github.token }}
          SEARCH_QUERY: "repo:github-community-projects/issue-metrics is:issue is:closed created:2024-01-01..2024-01-02"
          OUTPUT_FILE: "custom_metrics.md"
      - name: Assert custom output file exists
        run: |
          echo "Checking for custom_metrics.md output file..."
          if [ ! -f custom_metrics.md ]; then
            echo "FAIL: custom_metrics.md was not created"
            exit 1
          fi
          echo "PASS: custom_metrics.md exists"
          echo "--- File contents ---"
          cat custom_metrics.md
      - name: Assert default output file does not exist
        run: |
          echo "Checking that default issue_metrics.md was NOT created..."
          if [ -f issue_metrics.md ]; then
            echo "WARN: issue_metrics.md was also created (may be acceptable)"
          fi
          echo "PASS: custom output file check complete"
