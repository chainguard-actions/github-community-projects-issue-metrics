name: Test custom output file configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with custom OUTPUT_FILE and invalid token (expect failure at API)
        id: action
        uses: .
        env:
          GH_TOKEN: ghp_fakeinvalidtoken1234567890abcdefghij
          SEARCH_QUERY: "repo:actions/checkout is:issue created:2020-01-01..2020-01-02"
          OUTPUT_FILE: "custom_metrics.md"
          REPORT_TITLE: "Custom Metrics Report"
        continue-on-error: true

      - name: Assert action failed (expected - invalid token)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with an invalid GitHub token"
            exit 1
          fi
          echo "PASS: action correctly failed when using an invalid GitHub token with custom output file config"

      - name: Assert custom output file was not created (action failed before writing)
        run: |
          if [ -f "custom_metrics.md" ]; then
            echo "FAIL: custom_metrics.md should not exist since action failed"
            exit 1
          fi
          echo "PASS: custom output file was not created as expected"
