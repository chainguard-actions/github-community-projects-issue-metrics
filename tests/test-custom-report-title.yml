name: Test custom report title in output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run issue-metrics action with custom report title
        id: action
        uses: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEARCH_QUERY: "repo:github-community-projects/issue-metrics is:issue created:2024-01-01..2024-01-31"
          REPORT_TITLE: "My Custom Metrics Report"
          OUTPUT_FILE: issue_metrics.md
          HIDE_TIME_TO_CLOSE: "true"
          HIDE_TIME_TO_FIRST_RESPONSE: "true"

      - name: Assert output file contains custom title
        run: |
          echo "Checking for output file: issue_metrics.md"
          if [ ! -f "issue_metrics.md" ]; then
            echo "FAIL: issue_metrics.md was not created"
            exit 1
          fi
          echo "--- File contents ---"
          cat issue_metrics.md
          if ! grep -q "My Custom Metrics Report" issue_metrics.md; then
            echo "FAIL: custom report title 'My Custom Metrics Report' not found in output"
            exit 1
          fi
          echo "PASS: custom report title found in output file"
