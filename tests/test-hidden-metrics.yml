name: Test hidden metrics
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        env:
          GH_TOKEN: ${{ github.token }}
          SEARCH_QUERY: "repo:github-community-projects/issue-metrics is:issue is:closed created:2024-01-01..2024-01-31"
          REPORT_TITLE: "Hidden Metrics Test"
          HIDE_TIME_TO_CLOSE: "true"
          HIDE_TIME_TO_FIRST_RESPONSE: "true"
          HIDE_AUTHOR: "true"
      - name: Assert output file exists
        run: |
          echo "Checking for issue_metrics.md..."
          if [ ! -f "$GITHUB_WORKSPACE/issue_metrics.md" ]; then
            echo "FAIL: issue_metrics.md was not created"
            exit 1
          fi
          echo "PASS: issue_metrics.md exists"
      - name: Assert hidden columns are absent
        run: |
          echo "Contents of issue_metrics.md:"
          cat "$GITHUB_WORKSPACE/issue_metrics.md"
          if grep -q "Time to Close" "$GITHUB_WORKSPACE/issue_metrics.md"; then
            echo "FAIL: 'Time to Close' should be hidden but was found in output"
            exit 1
          fi
          echo "PASS: 'Time to Close' is correctly hidden"
          if grep -q "Time to First Response" "$GITHUB_WORKSPACE/issue_metrics.md"; then
            echo "FAIL: 'Time to First Response' should be hidden but was found in output"
            exit 1
          fi
          echo "PASS: 'Time to First Response' is correctly hidden"
