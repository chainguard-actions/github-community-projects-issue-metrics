name: Test hidden metrics - issue metrics with hidden columns
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run issue-metrics action with hidden metrics
        id: action
        uses: .
        env:
          GH_TOKEN: ${{ github.token }}
          SEARCH_QUERY: "repo:github-community-projects/issue-metrics is:issue created:>2023-01-01 created:<2023-12-31"
          REPORT_TITLE: "Hidden Metrics Report"
          OUTPUT_FILE: "issue_metrics.md"
          HIDE_TIME_TO_CLOSE: "true"
          HIDE_TIME_TO_FIRST_RESPONSE: "true"
          HIDE_ITEMS_CLOSED_COUNT: "true"

      - name: Assert output file was created
        run: |
          echo "Checking for issue_metrics.md..."
          if [ ! -f "issue_metrics.md" ]; then
            echo "FAIL: issue_metrics.md was not created"
            exit 1
          fi
          echo "PASS: issue_metrics.md exists"

      - name: Assert hidden metrics are not in output
        run: |
          echo "Checking that hidden metrics are absent..."
          if grep -q "Time to first response" issue_metrics.md; then
            echo "FAIL: 'Time to first response' should be hidden but was found in output"
            cat issue_metrics.md
            exit 1
          fi
          echo "PASS: 'Time to first response' is correctly hidden"

          if grep -q "Time to close" issue_metrics.md; then
            echo "FAIL: 'Time to close' should be hidden but was found in output"
            cat issue_metrics.md
            exit 1
          fi
          echo "PASS: 'Time to close' is correctly hidden"

      - name: Assert report title is present
        run: |
          echo "Checking report title..."
          if ! grep -q "Hidden Metrics Report" issue_metrics.md; then
            echo "FAIL: Report title not found in output"
            cat issue_metrics.md
            exit 1
          fi
          echo "PASS: Report title found"

      - name: Show output file contents
        run: |
          echo "=== issue_metrics.md contents ==="
          cat issue_metrics.md
