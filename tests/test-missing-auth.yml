name: Test missing authentication fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without any auth credentials (expect failure)
        id: action
        uses: .
        env:
          SEARCH_QUERY: "repo:actions/checkout is:issue created:2020-01-01..2020-01-02"
        continue-on-error: true

      - name: Assert action failed due to missing auth
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when no auth credentials are provided"
            exit 1
          fi
          echo "PASS: action correctly failed when no auth credentials were provided"
