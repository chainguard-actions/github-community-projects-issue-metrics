name: Test custom options - hidden metrics and custom title
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        env:
          GH_TOKEN: ${{ github.token }}
          SEARCH_QUERY: repo:actions/checkout is:issue is:closed created:2023-01-01..2023-01-07
          REPORT_TITLE: "Custom Metrics Report"
          OUTPUT_FILE: custom_metrics.md
          HIDE_TIME_TO_CLOSE: "true"
          HIDE_TIME_TO_FIRST_RESPONSE: "true"
          HIDE_AUTHOR: "true"
          HIDE_ITEMS_CLOSED_COUNT: "true"
        continue-on-error: true

      - name: Assert action ran with custom options or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded with custom options"
            if [ -f "custom_metrics.md" ]; then
              echo "PASS: custom_metrics.md was created"
              echo "--- File contents (first 30 lines) ---"
              head -30 custom_metrics.md
              # Verify the custom title appears in the output
              if grep -q "Custom Metrics Report" custom_metrics.md; then
                echo "PASS: custom report title found in output"
              else
                echo "FAIL: custom report title not found in output"
                exit 1
              fi
            else
              echo "FAIL: output file was not created"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (may be due to API rate limits or sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
