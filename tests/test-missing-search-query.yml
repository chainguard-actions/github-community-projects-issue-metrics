name: Test missing SEARCH_QUERY fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run action without SEARCH_QUERY
        uses: .
        continue-on-error: true
        env:
          GH_TOKEN: fake-token-for-testing

      - name: Assert action failed due to missing SEARCH_QUERY
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when SEARCH_QUERY is not set, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when SEARCH_QUERY was not set"
