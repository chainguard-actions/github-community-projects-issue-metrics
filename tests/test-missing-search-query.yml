name: Test missing search query fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # SEARCH_QUERY intentionally omitted to test failure behavior
      - name: Assert action failed without search query
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when SEARCH_QUERY is not set, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when SEARCH_QUERY was not provided"
