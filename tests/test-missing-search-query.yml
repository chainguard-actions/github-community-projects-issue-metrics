name: Test error handling - missing SEARCH_QUERY
on:
  workflow_dispatch:

jobs:
  test-missing-search-query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run issue-metrics action without SEARCH_QUERY (expect failure)
        id: action
        uses: .
        continue-on-error: true
        env:
          GH_TOKEN: "fake-token-for-act-testing"

      - name: Assert action failed due to missing search query
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: Expected action to fail when SEARCH_QUERY is not set, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: Action correctly failed when SEARCH_QUERY was not provided"
