name: Test error handling - missing SEARCH_QUERY
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        env:
          GH_TOKEN: ${{ github.token }}
          # Intentionally omit SEARCH_QUERY to trigger a ValueError
        continue-on-error: true

      - name: Assert action failed due to missing SEARCH_QUERY
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when SEARCH_QUERY is not set"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed without SEARCH_QUERY"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
