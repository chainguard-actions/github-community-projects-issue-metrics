name: Test missing SEARCH_QUERY fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without SEARCH_QUERY (expect failure)
        id: action
        uses: .
        env:
          GH_TOKEN: fake-token-for-testing
        continue-on-error: true

      - name: Assert action failed due to missing SEARCH_QUERY
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when SEARCH_QUERY is not set"
            exit 1
          fi
          echo "PASS: action correctly failed when SEARCH_QUERY was not set"
