name: Test missing SEARCH_QUERY fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          # Intentionally omit SEARCH_QUERY to trigger the ValueError
          GH_TOKEN: ${{ github.token }}

      - name: Assert action failed due to missing SEARCH_QUERY
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when SEARCH_QUERY is not set"
          else
            echo "FAIL: expected action to fail but got outcome '$OUTCOME'"
            exit 1
          fi
