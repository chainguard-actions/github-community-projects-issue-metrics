name: Test missing GH_TOKEN fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run action without GH_TOKEN
        uses: .
        continue-on-error: true
        env:
          SEARCH_QUERY: "repo:actions/checkout is:issue created:2020-01-01..2020-01-02"

      - name: Assert action failed due to missing GH_TOKEN
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when GH_TOKEN is not set, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when GH_TOKEN was not set"
