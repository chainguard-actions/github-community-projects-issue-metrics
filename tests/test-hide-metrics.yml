name: Test hide metrics options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run issue-metrics action with hidden metrics
        id: action
        uses: .
        env:
          GH_TOKEN: ${{ github.token }}
          SEARCH_QUERY: "repo:github-community-projects/issue-metrics is:issue is:closed created:2024-01-01..2024-01-02"
          HIDE_TIME_TO_CLOSE: "true"
          HIDE_TIME_TO_FIRST_RESPONSE: "true"
      - name: Assert output file exists
        run: |
          echo "Checking for issue_metrics.md output file..."
          if [ ! -f issue_metrics.md ]; then
            echo "FAIL: issue_metrics.md was not created"
            exit 1
          fi
          echo "PASS: issue_metrics.md exists"
          echo "--- File contents ---"
          cat issue_metrics.md
          echo "Checking that hidden metrics are not in output..."
          if grep -q "Time to Close" issue_metrics.md; then
            echo "FAIL: 'Time to Close' should be hidden but was found in output"
            exit 1
          fi
          echo "PASS: 'Time to Close' is correctly hidden"
          if grep -q "Time to First Response" issue_metrics.md; then
            echo "FAIL: 'Time to First Response' should be hidden but was found in output"
            exit 1
          fi
          echo "PASS: 'Time to First Response' is correctly hidden"
