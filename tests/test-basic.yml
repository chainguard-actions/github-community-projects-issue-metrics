name: Test basic usage - search issues in public repo
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        env:
          GH_TOKEN: ${{ github.token }}
          SEARCH_QUERY: repo:actions/checkout is:issue is:closed created:2023-01-01..2023-01-07
          REPORT_TITLE: "Test Issue Metrics"
          OUTPUT_FILE: issue_metrics.md
          HIDE_TIME_TO_CLOSE: "false"
          HIDE_TIME_TO_FIRST_RESPONSE: "false"
        continue-on-error: true

      - name: Assert action ran and produced output or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded, checking for output file..."
            if [ -f "issue_metrics.md" ]; then
              echo "PASS: issue_metrics.md was created"
              echo "--- File contents (first 20 lines) ---"
              head -20 issue_metrics.md
            else
              echo "FAIL: issue_metrics.md was not created"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (may be due to API rate limits or sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
