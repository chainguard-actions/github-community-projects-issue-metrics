name: Test basic usage - search with no results
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        env:
          # Use a very narrow date range on a real public repo to get 0 results
          # The action handles 0 results gracefully by writing an empty report
          SEARCH_QUERY: repo:actions/checkout is:issue created:2000-01-01..2000-01-02
          GH_TOKEN: ${{ github.token }}

      - name: Assert output file was created
        run: |
          echo "Checking for issue_metrics.md..."
          if [ ! -f "$GITHUB_WORKSPACE/issue_metrics.md" ]; then
            echo "FAIL: issue_metrics.md was not created"
            exit 1
          fi
          echo "PASS: issue_metrics.md exists"
          echo "--- Contents ---"
          cat "$GITHUB_WORKSPACE/issue_metrics.md"

      - name: Assert markdown contains expected header
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/issue_metrics.md")
          echo "content: $CONTENT"
          if echo "$CONTENT" | grep -q "Issue Metrics"; then
            echo "PASS: markdown contains 'Issue Metrics'"
          else
            echo "FAIL: markdown does not contain 'Issue Metrics'"
            exit 1
          fi
