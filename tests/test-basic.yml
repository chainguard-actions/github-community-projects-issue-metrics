name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run issue-metrics action
        id: action
        uses: .
        env:
          GH_TOKEN: ${{ github.token }}
          SEARCH_QUERY: repo:github-community-projects/issue-metrics is:issue created:2020-01-01..2020-01-31
          OUTPUT_FILE: ${{ github.workspace }}/issue_metrics.md
      - name: Assert markdown report was created
        run: |
          echo "Checking for issue_metrics.md..."
          if [ ! -f "$GITHUB_WORKSPACE/issue_metrics.md" ]; then
            echo "FAIL: issue_metrics.md was not created"
            exit 1
          fi
          echo "PASS: issue_metrics.md exists"
          echo "--- Contents ---"
          cat "$GITHUB_WORKSPACE/issue_metrics.md"
      - name: Assert markdown report contains expected header
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/issue_metrics.md")
          echo "actual content: $CONTENT"
          if ! echo "$CONTENT" | grep -q "Issue Metrics"; then
            echo "FAIL: expected 'Issue Metrics' header in report"
            exit 1
          fi
          echo "PASS: report contains expected header"
