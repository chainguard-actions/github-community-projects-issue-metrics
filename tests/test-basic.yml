name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        env:
          GH_TOKEN: ${{ github.token }}
          SEARCH_QUERY: "repo:github-community-projects/issue-metrics is:issue created:2024-01-01..2024-01-31"
          REPORT_TITLE: "Test Issue Metrics Report"
          OUTPUT_FILE: "issue_metrics.md"
          HIDE_TIME_TO_ANSWER: "true"
          HIDE_TIME_TO_FIRST_REVIEW: "true"

      - name: Assert output file was created
        run: |
          echo "Checking for issue_metrics.md..."
          if [ ! -f "$GITHUB_WORKSPACE/issue_metrics.md" ]; then
            echo "FAIL: issue_metrics.md was not created"
            exit 1
          fi
          echo "PASS: issue_metrics.md exists"

      - name: Assert output file contains report title
        run: |
          echo "Checking report title in issue_metrics.md..."
          if ! grep -q "Test Issue Metrics Report" "$GITHUB_WORKSPACE/issue_metrics.md"; then
            echo "FAIL: Report title not found in issue_metrics.md"
            cat "$GITHUB_WORKSPACE/issue_metrics.md"
            exit 1
          fi
          echo "PASS: Report title found"

      - name: Assert output file is non-empty
        run: |
          SIZE=$(wc -c < "$GITHUB_WORKSPACE/issue_metrics.md")
          echo "File size: $SIZE bytes"
          if [ "$SIZE" -lt 10 ]; then
            echo "FAIL: issue_metrics.md is too small (${SIZE} bytes)"
            exit 1
          fi
          echo "PASS: issue_metrics.md has content"
